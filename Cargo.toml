[package]
name = "pelers"
version = "1.0.0-alpha2"
authors = ["Farhan Kurnia Pratama <farhnkrnapratma@gmail.com>"]
edition = "2024"
description = "Pelers, but in Rust"
readme = "README.md"
homepage = "https://fkp.my.id"
repository = "https://github.com/farhnkrnapratma/pelers"
license = "MIT OR Apache-2.0"
keywords = ["mermaid", "diagram", "diagrams", "svg", "renderer"]
categories = ["rendering"]
include = [
  "/build.rs",
  "/src/**/*.rs",
  "/README.md",
  "/NOTICE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.107", optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }

[dev-dependencies]
flate2 = "1.1.11"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"

[build-dependencies]
napi-build = { version = "2", optional = true }

[dependencies]
jiff = "1.0.1"
regex = "1.13.1"
url = "2.5.8"

[profile.release]
lto = "fat"
codegen-units = 1
