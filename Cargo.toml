[package]
name = "pelers"
version = "1.0.0-alpha2"
authors = ["Farhan Kurnia Pratama <farhnkrnapratma@gmail.com>"]
edition = "2024"
description = "Pelers, but in Rust"
readme = "README.md"
homepage = "https://fkp.my.id"
repository = "https://github.com/farhnkrnapratma/pelers"
license = "MIT OR Apache-2.0"
keywords = ["mermaid", "diagram", "diagrams", "svg", "renderer"]
categories = ["rendering"]
include = ["/build.rs", "/src/**/*.rs", "/README.md", "/NOTICE", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
mimalloc = "0.1.52"
regex = "1.13.1"
url = "2.5.8"

[profile.release]
lto = "fat"
codegen-units = 1
