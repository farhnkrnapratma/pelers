[package]
name = "pelers"
version = "1.0.0-alpha2"
authors = ["Farhan Kurnia Pratama <farhnkrnapratma@gmail.com>"]
edition = "2024"
description = "Pelers, but in Rust"
readme = "README.md"
homepage = "https://fkp.my.id"
repository = "https://github.com/farhnkrnapratma/pelers"
license = "MIT OR Apache-2.0"
keywords = ["mermaid", "diagram", "diagrams", "svg", "renderer"]
categories = ["rendering"]
include = [
  "/build.rs",
  "/src/**/*.rs",
  "/README.md",
  "/NOTICE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
wasm = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
jiff = "1.0.1"
regex = { version = "1.13.1", default-features = false, features = ["perf"] }
url = "2.5.8"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system"] }
js-sys = "0.3.107"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
flate2 = "1.1.11"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"

[build-dependencies]
napi-build = { version = "2", optional = true }

[dependencies]
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[profile.release]
lto = "fat"
codegen-units = 1
