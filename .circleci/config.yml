version: 2.1

executors:
  rust:
    docker:
      - image: cimg/rust:1.99.1-node
    resource_class: medium
  rust-arm:
    docker:
      - image: cimg/rust:1.99.1-node
    resource_class: arm.medium
  alpine:
    docker:
      - image: rust:1.99.1-alpine
    resource_class: medium
    shell: /bin/bash -eo pipefail
  alpine-arm:
    docker:
      - image: rust:1.99.1-alpine
    resource_class: arm.medium
    shell: /bin/bash -eo pipefail

commands:
  setup-bun:
    steps:
      - run:
          name: Install bun
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.5"
            ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
  setup-deny:
    steps:
      - run:
          name: Install cargo-deny
          command: |
            curl -fsSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
              | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/cargo-deny'
  setup-trufflehog:
    steps:
      - run:
          name: Install trufflehog
          command: |
            base=https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.8
            curl -fsSL -o "$HOME/trufflehog.tar.gz" "$base/trufflehog_3.99.8_linux_amd64.tar.gz"
            curl -fsSL -o "$HOME/trufflehog.sums" "$base/trufflehog_3.99.8_checksums.txt"
            (cd "$HOME" && grep ' trufflehog_3.99.8_linux_amd64.tar.gz$' trufflehog.sums | awk '{print $1"  trufflehog.tar.gz"}' | sha256sum -c -)
            mkdir -p "$HOME/.local/bin"
            tar -xzf "$HOME/trufflehog.tar.gz" -C "$HOME/.local/bin" trufflehog
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
  setup-wasm-tools:
    steps:
      - run:
          name: Install wasm-bindgen and wasm-opt
          command: |
            mkdir -p "$HOME/.local/bin"
            cd "$HOME"
            curl -fsSL -o wasm-bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
            curl -fsSL -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz
            printf '%s\n' \
              "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  wasm-bindgen.tar.gz" \
              "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  binaryen.tar.gz" \
              | sha256sum -c -
            tar -xzf wasm-bindgen.tar.gz --strip-components=1 -C .local/bin wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen
            tar -xzf binaryen.tar.gz --strip-components=2 -C .local/bin binaryen-version_130/bin/wasm-opt
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
  setup-zig:
    steps:
      - run:
          name: Install zig
          command: |
            mkdir -p "$HOME/.local"
            curl -fsSL -o "$HOME/zig.tar.xz" https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
            echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $HOME/zig.tar.xz" | sha256sum -c -
            tar -xJf "$HOME/zig.tar.xz" -C "$HOME/.local"
            echo 'export PATH="$HOME/.local/zig-x86_64-linux-0.15.2:$PATH"' >> "$BASH_ENV"
  keep-addons:
    steps:
      - run:
          name: Collect the addons
          command: mkdir -p addons && cp ./*.node addons/
      - persist_to_workspace:
          root: .
          paths:
            - addons
  restore-cargo:
    parameters:
      scope:
        type: string
    steps:
      - restore_cache:
          keys:
            - cargo-v1-<< parameters.scope >>-{{ checksum "Cargo.lock" }}
            - cargo-v1-<< parameters.scope >>-
  save-cargo:
    parameters:
      scope:
        type: string
    steps:
      - save_cache:
          key: cargo-v1-<< parameters.scope >>-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

jobs:
  reuse:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: pip install --quiet reuse==6.3.0
      - run: reuse lint

  lint:
    executor: rust
    steps:
      - checkout
      - restore-cargo:
          scope: lint
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --lib --target wasm32-unknown-unknown --features wasm --locked -- -D warnings
      - setup-deny
      - run: cargo deny check
      - save-cargo:
          scope: lint

  test:
    executor: rust
    steps:
      - checkout
      - restore-cargo:
          scope: test
      - setup-bun
      - setup-wasm-tools
      - run: rustup component add llvm-tools
      - run: rustup target add wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: cargo test --locked
      - run:
          name: Build the release addon
          command: bun run build:release
          no_output_timeout: 45m
      - run: bun run build:wasm
      - run: bun run test:bindings
      - run: bun run test:dom
      - run:
          name: Collect the release builds
          command: |
            mkdir -p artifacts
            cp -r ./*.node index.native.js index.native.d.ts wasm dist artifacts/
      - store_artifacts:
          path: artifacts
      - keep-addons
      - save-cargo:
          scope: test

  addon-linux:
    parameters:
      platform:
        type: executor
      prepare:
        type: steps
        default: []
    executor: << parameters.platform >>
    steps:
      - steps: << parameters.prepare >>
      - checkout
      - setup-bun
      - run: rustup component add llvm-tools
      - run: bun install --frozen-lockfile
      - run:
          name: Build the release addon
          command: bun run build:release
          no_output_timeout: 45m
      - run: bun run test:bindings
      - keep-addons

  addon-macos:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Install rust and node
          command: |
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1 \
              --component llvm-tools --target x86_64-apple-darwin
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            command -v node || brew install node
      - setup-bun
      - run: bun install --frozen-lockfile
      - run:
          name: Build the release addon
          command: bun run build:release
          no_output_timeout: 45m
      - run: bun run test:bindings
      - run:
          name: Cross-compile the x64 addon
          command: bun run build:release --target x86_64-apple-darwin
          no_output_timeout: 45m
      - keep-addons

  addon-windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Install rust and bun
          command: |
            curl -fsSL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain 1.99.1 --component llvm-tools
            rm rustup-init.exe
            powershell.exe -NoProfile -Command "\$env:BUN_VERSION='bun-v1.4.5'; irm bun.sh/install.ps1 | iex"
            echo 'export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
      - run: bun install --frozen-lockfile
      - run:
          name: Build the release addon
          command: bun run build:release
          no_output_timeout: 45m
      - run: bun run test:bindings
      - keep-addons

  addon-cross:
    parameters:
      target:
        type: string
    executor: rust
    steps:
      - checkout
      - setup-bun
      - setup-zig
      - run:
          name: Install LLVM for the MSVC headers
          command: |
            case "<< parameters.target >>" in *windows*) ;; *) exit 0 ;; esac
            sudo apt-get update -qq
            sudo apt-get install -y -qq lsb-release software-properties-common gnupg
            curl -fsSL -o llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash llvm.sh 20
            rm llvm.sh
            echo 'export PATH="/usr/lib/llvm-20/bin:$PATH"' >> "$BASH_ENV"
      - run: rustup target add << parameters.target >>
      - run: bun install --frozen-lockfile
      - run:
          name: Cross-compile the addon
          command: bun run build:release --target << parameters.target >>
          no_output_timeout: 45m
      - keep-addons

  package:
    executor: rust
    steps:
      - checkout
      - setup-bun
      - attach_workspace:
          at: .
      - run: bun install --frozen-lockfile
      - run: bunx napi create-npm-dirs
      - run: bunx napi artifacts --output-dir addons
      - store_artifacts:
          path: npm

  coverage:
    executor: rust
    steps:
      - checkout
      - restore-cargo:
          scope: coverage
      - run:
          name: Install cargo-llvm-cov
          command: |
            rustup component add llvm-tools-preview
            curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz \
              | tar -xz -C "$HOME/.cargo/bin"
      - run: cargo llvm-cov --locked --summary-only --fail-under-lines 99.999 --fail-under-functions 99.999
      - save-cargo:
          scope: coverage

  secrets:
    docker:
      - image: cimg/python:3.12
    steps:
      - setup-trufflehog
      # CircleCI checks out a blobless clone, so trufflehog scans a full clone instead
      - run:
          name: Scan history
          command: |
            git clone --quiet "https://github.com/farhnkrnapratma/pelers.git" "$HOME/scan"
            trufflehog git "file://$HOME/scan" --results=verified --fail --no-update

  commitlint:
    executor: rust
    steps:
      - checkout
      - setup-bun
      - run: bun install --frozen-lockfile
      - run:
          name: Lint commit messages
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow; fi
            git fetch --quiet origin main:refs/remotes/origin/main
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              bunx --bun --no-install commitlint --last
            else
              bunx --bun --no-install commitlint --from "$(git merge-base origin/main HEAD)" --to HEAD
            fi

workflows:
  ci:
    jobs:
      - reuse
      - lint
      - test
      - addon-linux:
          name: addon-linux-arm64-gnu
          platform: rust-arm
          filters: &release-branches
            branches:
              only:
                - main
                - /release\/.*/
      - addon-linux:
          name: addon-linux-x64-musl
          platform: alpine
          filters: *release-branches
          prepare: &alpine-tools
            - run:
                name: Install the build tools
                shell: /bin/sh -eo pipefail
                command: apk add --no-cache bash curl git openssh-client unzip nodejs build-base libstdc++ libgcc
      - addon-linux:
          name: addon-linux-arm64-musl
          platform: alpine-arm
          filters: *release-branches
          prepare: *alpine-tools
      - addon-macos:
          filters: *release-branches
      - addon-windows:
          filters: *release-branches
      - addon-cross:
          filters: *release-branches
          matrix:
            parameters:
              target:
                - armv7-unknown-linux-gnueabihf
                - powerpc64le-unknown-linux-gnu
                - s390x-unknown-linux-gnu
                - riscv64gc-unknown-linux-gnu
                - aarch64-pc-windows-msvc
                - i686-pc-windows-msvc
      - package:
          filters: *release-branches
          requires:
            - test
            - addon-linux-arm64-gnu
            - addon-linux-x64-musl
            - addon-linux-arm64-musl
            - addon-macos
            - addon-windows
            - addon-cross
      - coverage
      - secrets
      - commitlint
