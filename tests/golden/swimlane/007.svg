.67)"><text class="pelers-cluster-label" fill="var(--_m)" x="28" y="62.27" text-anchor="middle">Customer</text></g></g></g><g class="pelers-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pelers-edge" data-id="L_request_triage_0"><path d="M138.47,80.67L138.47,133.34C138.47,145.74 146.07,153.34 158.47,153.34L213.94,153.34"/><path class="pelers-marker" d="M220.94,153.34L212.94,156.7L212.94,149.98Z" fill="var(--_l)" stroke="none"/></g><g class="pelers-edge" data-id="L_triage_resolve_0"><path d="M261.62,177.34L261.62,238.03C261.62,250.43 269.22,258.03 281.62,258.03L311.29,258.03"/><path class="pelers-marker" d="M318.29,258.03L310.29,261.39L310.29,254.67Z" fill="var(--_l)" stroke="none"/></g></g><g class="pelers-nodes"><g class="pelers-node pelers-shape-rect" data-id="request" transform="translate(138.47,56.67)"><rect x="-66.47" y="-24" width="132.94" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pelers-label" x="0" y="5.6" text-anchor="middle">Open request</text></g><g class="pelers-node pelers-shape-rect" data-id="triage" transform="translate(261.62,153.34)"><rect x="-40.67" y="-24" width="81.34" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pelers-label" x="0" y="5.6" text-anchor="middle">Triage</text></g><g class="pelers-node pelers-shape-rect" data-id="resolve" transform="translate(365.18,258.03)"><rect x="-46.9" y="-24" width="93.79" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pelers-label" x="0" y="5.6" text-anchor="middle">Resolve</text></g></g></svg>